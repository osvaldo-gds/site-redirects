<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>PoC – Open Redirect</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #ff4d4d;
    }
    .box {
      background: #1f1f1f;
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 0 10px #000;
    }
    .button {
      background-color: #2962ff;
      color: white;
      border: none;
      padding: 12px 24px;
      margin-top: 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚨 Redirecionamento Não Autorizado</h1>
    <p>Este site permitiu que você fosse enviado para esta página através de um parâmetro malicioso.</p>
    <p>Esse comportamento é típico de uma vulnerabilidade de <strong>Open Redirect</strong>.</p>
    <p id="info"></p>
    <button class="button" id="goBtn" style="display: none;">Continuar para o destino</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get("redirect");

    if (redirectUrl) {
      document.getElementById("info").innerText = "Parâmetro detectado: " + redirectUrl;
      const btn = document.getElementById("goBtn");
      btn.style.display = "inline-block";
      btn.onclick = () => {
        window.location.href = redirectUrl;
      };
    } else {
      document.getElementById("info").innerText = "Nenhum parâmetro de redirecionamento foi detectado.";
    }
  </script>
</body>
</html>
